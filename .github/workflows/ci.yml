name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, tests and generated marks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm from packageManager and the Node.js from devEngines.runtime, then runs pnpm install.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Check that the committed marks match the palette
        run: pnpm run check
