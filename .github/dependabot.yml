version: 2
updates:
  # Keeps the GitHub Actions in .github/workflows up to date. They are pinned to commit SHAs;
  # Dependabot updates both the SHA and the version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request per week for all actions, instead of one per action.
    groups:
      actions:
        patterns: ['*']
    # Waits a week after a release, which gives a compromised or broken version time to be
    # caught and pulled before it runs here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Opens the pull request for each new version of the palette. Its check fails until the marks
  # are regenerated on that branch, so the pull request's diff shows every color that changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: '@sanctuary-ds/tokens'
    # Waits two days after a release, which gives a bad release time to be caught and pulled.
    # Shorter than the actions' week on purpose: the palette is ours, published from CI with
    # provenance, and pnpm's trustPolicy refuses a release that lost it.
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown]
    commit-message:
      prefix: chore(deps)
