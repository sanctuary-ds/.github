name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest steps, link or snippet that shows it. For a color, name the flavor, accent and glazing.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the package or the commit you used.
